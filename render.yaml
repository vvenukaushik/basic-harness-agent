services:
  - type: web
    name: basic-harness-agent
    runtime: docker
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /healthz
    numInstances: 1
    envVars:
      - key: GOOGLE_GENAI_USE_VERTEXAI
        value: "FALSE"
      - key: MODEL_NAME
        value: gemini-3.5-flash-lite
      - key: GOOGLE_API_KEY
        sync: false
      - key: DEMO_USER
        sync: false
      - key: DEMO_PASSWORD
        sync: false
